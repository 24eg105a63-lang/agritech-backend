services:
  - type: web
    name: agritech-backend
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: agritech-postgres
          property: connectionString

databases:
  - name: agritech-postgres
    databaseName: agritech
    user: agritech_user
    plan: free
    region: oregon
